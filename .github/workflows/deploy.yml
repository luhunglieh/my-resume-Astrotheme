name: Deploy to GitHub Pages

on:
  # Trigger the workflow on push to the main branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# 資安規範：
# 1. Node 18 已於 2025-04-30 終止支援；Node 20 已 EOL（Node 20 於 2026-04-30 終止支援）。
# 2. 於 Workflow 頂層設定 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24，強制所有第三方 JS Actions
#    (如 checkout、configure-pages、upload-pages-artifact、deploy-pages) 底層 Runtime 皆以 Node 24 執行。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 棄用封裝黑盒 withastro/action@v3（其未指定時預設退回已 EOL 的舊版），改為透明可控之展開步驟
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Type-check and build with Astro
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

